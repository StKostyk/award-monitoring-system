<mat-form-field class="search-field" subscriptSizing="dynamic">
  <mat-label>{{ label() | transloco }}</mat-label>
  <input
    matInput
    type="search"
    [maxlength]="maxLength"
    [ngModel]="text()"
    (ngModelChange)="type($event)"
    data-testid="filter-q"
  />
  @if (text()) {
    <button
      mat-icon-button
      matIconSuffix
      type="button"
      [attr.aria-label]="'app.clearSearch' | transloco"
      (click)="clear()"
      data-testid="filter-q-clear"
    >
      <mat-icon>close</mat-icon>
    </button>
  }
</mat-form-field>
