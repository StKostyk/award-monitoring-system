<div class="auth-layout">
  <aside class="auth-layout__brand" data-testid="auth-brand">
    <img class="auth-layout__logo" [src]="brand().logo" alt="" width="56" height="56" />
    <div>
      <p class="auth-layout__name">{{ brands.text(brand().name) }}</p>
      <p class="auth-layout__organization">{{ brands.text(brand().organization) }}</p>
    </div>
    <p class="auth-layout__claim" data-testid="auth-claim">{{ 'authLayout.claim' | transloco }}</p>
  </aside>
  <div class="auth-layout__content">
    <ng-content />
  </div>
</div>
