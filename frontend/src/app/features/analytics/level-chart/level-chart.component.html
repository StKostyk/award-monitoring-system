<app-chart [option]="option()" [description]="description()" [height]="height()">
  <table class="analytics-table" data-testid="level-table">
    <caption>
      {{
        'analytics.levels.title' | transloco
      }}
    </caption>
    <thead>
      <tr>
        <th scope="col">{{ 'analytics.table.level' | transloco }}</th>
        <th scope="col">{{ 'analytics.table.count' | transloco }}</th>
      </tr>
    </thead>
    <tbody>
      @for (row of byLevel(); track row.level) {
        <tr>
          <th scope="row">{{ 'categories.levels.' + row.level | transloco }}</th>
          <td>{{ row.count }}</td>
        </tr>
      }
    </tbody>
  </table>
</app-chart>
