<h2 mat-dialog-title>{{ 'delegations.revoke.title' | transloco }}</h2>
<mat-dialog-content>
  <p data-testid="revoke-delegation-text">
    {{
      'delegations.revoke.text'
        | transloco: { role: roleName(), organization: organization(), name: delegateName() }
    }}
  </p>
  <p>{{ 'delegations.revoke.warning' | transloco }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [mat-dialog-close]="false" data-testid="revoke-delegation-cancel">
    {{ 'delegations.revoke.cancel' | transloco }}
  </button>
  <button mat-flat-button type="button" [mat-dialog-close]="true" data-testid="revoke-delegation-confirm">
    {{ 'delegations.revoke.confirm' | transloco }}
  </button>
</mat-dialog-actions>
