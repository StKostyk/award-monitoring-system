# =============================================================================
# Award Monitoring System - Nginx Configuration
# =============================================================================

# Behind the TLS proxy (Caddy) keep its scheme; direct access falls back to this server's own
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $forwarded_proto $forwarded_port {
    https   443;
    default $server_port;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml;

    # Security headers (repeated in every location that adds its own headers, nginx does not inherit them)
    include /etc/nginx/snippets/security-headers.conf;

    # Backend API: no site policy, the backend sets its own (document downloads carry a sandbox policy); headers
    # added here stop nginx from adding the site headers, and the backend's copies of the shared ones are
    # replaced so that every response, nginx's own errors included, carries each exactly once
    location ^~ /api/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # document uploads: 10 MB per file plus the multipart overhead (Spring max-request-size)
        client_max_body_size 11m;
        error_page 413 = @upload_too_large;
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    # Backend: its description (Swagger UI where enabled), authorization server endpoints and its login page
    # share this origin
    location ~ ^/(oauth2/|connect/|\.well-known/|login-assets/|swagger-ui/|v3/api-docs) {
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    # A body over the limit is answered like the backend's own refusal, as problem details
    location @upload_too_large {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/problem+json;
        return 413 '{"type":"urn:awards:problem:file-too-large","title":"Payload Too Large","status":413,"detail":"The file is larger than the limit"}';
    }

    location ~ ^/(login|logout|error)$ {
        include /etc/nginx/snippets/backend-proxy.conf;
    }

    # Translations change with every release without a hash in the name: revalidate on every load
    location ^~ /i18n/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Brand file and logo are replaced per deployment without a hash in the name: revalidate on every load
    location ^~ /brand/ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Cache static assets
    location ~*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # Angular routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 'OK';
    }

    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

