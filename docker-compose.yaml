services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: award-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-award_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-popqaz}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-award_monitoring}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - award-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: award-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - award-network

  # Local SMTP server with web inbox
  mailpit:
    image: axllent/mailpit:latest
    container_name: award-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/livez"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - award-network

  # S3-compatible object storage
  minio:
    image: quay.io/minio/minio:latest
    container_name: award-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - award-network

  # Spring Boot Backend
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: award-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-award_monitoring}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-popqaz}
      # Redis connection
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # OpenTelemetry configuration (requires monitoring stack: docker-compose -f infra/docker-compose.monitoring.yml up -d)
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      - OTEL_SERVICE_NAME=award-monitoring-system
      # Mail and object storage
      - SPRING_MAIL_HOST=mailpit
      - SPRING_MAIL_PORT=1025
      - STORAGE_S3_ENDPOINT=http://minio:9000
      - STORAGE_S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - STORAGE_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      # Authorization server as seen from the browser (nginx proxies it on port 80)
      - AUTH_ISSUER=http://localhost
      - AUTH_ALLOWED_ORIGINS=http://localhost,http://localhost:4200,http://localhost:8080
      - AUTH_REDIRECT_URIS=http://localhost/callback,http://localhost:4200/callback,http://localhost:8080/swagger-ui/oauth2-redirect.html
      - AUTH_POST_LOGOUT_REDIRECT_URIS=http://localhost,http://localhost:4200
      # Environment identifier for logging
      - ENVIRONMENT=docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/liveness"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - award-network
    # Add resource limits to prevent OOM issues
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  # Angular Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      shm_size: '4gb'
      args:
        - NODE_ENV=production
        - BUILDKIT_INLINE_CACHE=1
      labels:
        - "com.example.build-date=${BUILD_DATE:-}"
    container_name: award-frontend
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - award-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  award-network:
    driver: bridge
    # Use a custom subnet to avoid conflicts with other Docker networks
    ipam:
      config:
        - subnet: 172.25.0.0/16
