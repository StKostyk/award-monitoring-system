<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{error.429.title}">Too many requests</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<main class="card">
    <header class="card__header">
        <span class="card__brand">ChNU Awards</span>
    </header>
    <h1 th:text="#{error.429.title}">Too many requests</h1>
    <p class="alert" role="alert" th:text="#{error.429.text}">Too many requests from your address. Try again in a minute.</p>
</main>
</body>
</html>
