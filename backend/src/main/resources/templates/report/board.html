<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${report.language().code()}">
<head>
  <meta charset="UTF-8"/>
  <title th:text="${report.title()}">Board report</title>
  <style th:inline="css">
    @page {
      size: A4 landscape;
      margin: 14mm 16mm 16mm 16mm;
      @bottom-center {
        content: "[(#{report.page})] " counter(page) " [(#{report.pageOf})] " counter(pages);
        font-family: 'Noto Sans';
        font-size: 8pt;
        color: #555555;
      }
    }
    body { font-family: 'Noto Sans'; font-size: 9pt; color: #111111; }
    .break { page-break-before: always; }
    h1 { font-size: 20pt; margin: 40mm 0 10pt 0; }
    h2 { font-size: 14pt; margin: 0 0 8pt 0; page-break-after: avoid; }
    h3 { font-size: 10.5pt; margin: 10pt 0 3pt 0; page-break-after: avoid; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; -fs-table-paginate: paginate; }
    thead { display: table-header-group; }
    tr { page-break-inside: avoid; }
    th { font-weight: bold; text-align: left; border-bottom: 0.8pt solid #444444; padding: 2pt 4pt; }
    td { border-bottom: 0.4pt solid #cccccc; padding: 2pt 4pt; vertical-align: top; }
    th, td { overflow-wrap: break-word; word-wrap: break-word; }
    .label { width: 34%; }
    .number { text-align: right; }
    table.header { width: 70%; font-size: 11pt; }
    table.header td { border: none; padding: 1.5pt 8pt 1.5pt 0; }
    table.header td.label { width: 30%; color: #444444; }
    .note { color: #333333; margin: 0 0 4pt 0; }
    .empty { color: #444444; margin: 0; }
    table.chart td { border: none; padding: 1.5pt 4pt; vertical-align: middle; }
    table.chart td.value { width: 10%; text-align: right; }
    .track { width: 100%; }
    .bar { height: 9pt; background-color: #2f6db5; }
  </style>
</head>
<body>
  <div class="title-page">
    <h1 th:text="${report.title()}">Board report</h1>
    <table class="header">
      <tr th:each="field : ${report.header()}">
        <td class="label" th:text="${field.label()}">Label</td>
        <td th:text="${field.value()}">Value</td>
      </tr>
    </table>
    <p class="note" th:text="${report.note()}">Note</p>
  </div>
  <div class="break" th:each="page : ${report.pages()}" th:attr="data-page=${page.key()}">
    <h2 th:text="${page.title()}">Topic</h2>
    <p class="note" th:each="note : ${page.notes()}" th:text="${note}">Note</p>
    <th:block th:each="table : ${page.tables()}">
      <h3 th:if="${table.title() != null}" th:text="${table.title()}">Table</h3>
      <p class="empty" th:if="${table.rows().isEmpty()}" th:text="${table.empty()}">Empty</p>
      <table th:unless="${table.rows().isEmpty()}">
        <thead th:unless="${table.columns().isEmpty()}">
          <tr>
            <th class="label" th:text="${table.columns()[0]}">Item</th>
            <th class="number" th:each="column, at : ${table.columns()}" th:unless="${at.first}"
                th:text="${column}">Value</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="row : ${table.rows()}">
            <td th:class="${row.values().isEmpty()} ? 'text' : 'label'" th:text="${row.label()}">Item</td>
            <td class="number" th:each="value : ${row.values()}" th:text="${value}">1</td>
          </tr>
        </tbody>
      </table>
    </th:block>
    <th:block th:each="chart : ${page.charts()}">
      <h3 th:text="${chart.title()}">Chart</h3>
      <p class="empty" th:if="${chart.bars().isEmpty()}" th:text="#{report.empty}">Empty</p>
      <table class="chart" th:unless="${chart.bars().isEmpty()}">
        <tr th:each="bar : ${chart.bars()}">
          <td class="label" th:text="${bar.label()}">Item</td>
          <td><div class="track"><div class="bar" th:style="'width: ' + ${bar.width()} + '%'"></div></div></td>
          <td class="value" th:text="${bar.value()}">1</td>
        </tr>
      </table>
    </th:block>
  </div>
</body>
</html>
