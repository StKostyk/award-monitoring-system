<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head th:replace="~{fragments/brand :: head(#{error.generic.title})}">
    <title>Something went wrong</title>
</head>
<body>
<aside th:replace="~{fragments/brand :: panel}"></aside>
<div class="page">
    <main class="card">
        <h1 th:text="#{error.generic.title}">Something went wrong</h1>
        <p class="alert" role="alert" th:text="#{error.generic.text(${status})}">The request could not be completed.</p>
        <p class="card__link"><a th:href="@{/}" th:text="#{error.generic.link}">Go to the application</a></p>
    </main>
</div>
</body>
</html>
