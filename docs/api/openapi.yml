openapi: 3.1.0
info:
  title: Award Monitoring & Tracking System API
  version: 1.0.0
  description: |
    RESTful API for enterprise award monitoring and tracking platform.
    
    ## Authentication
    The application is its own OAuth 2.1 / OpenID Connect provider. Browser clients obtain tokens through the
    authorization code flow with PKCE and send `Authorization: Bearer <access token>` on every `/api` request.
    
    ## Implementation status
    Operations marked `x-status: planned` are contract drafts for later epics and have no implementation yet.
    The HTML sign-in pages (`GET /login`, `GET /`) are served by the authorization server and are not API operations.

    ## Rate Limiting
    Counters in Redis, answered with 429 and `Retry-After`: the authentication endpoints (sign-in, token, `/auth`)
    are limited per client address (20 requests a minute by default), document uploads per user (20 a minute).
    Other operations have no request quota.
    
    ## Response Formats
    All responses are JSON. Dates are ISO 8601 format (UTC).
    
    ## Error Handling
    Errors follow RFC 7807 Problem Details format.
    
  contact:
    name: API Support
    email: support@award-system.edu.ua
    url: https://award-system.edu.ua/docs
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://api.award-system.edu.ua/v1
    description: Production server
  - url: https://staging-api.award-system.edu.ua/v1
    description: Staging server
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Authentication
    description: OAuth2 authentication and token management
  - name: Awards
    description: Award CRUD and submission operations
  - name: Workflows
    description: Award approval workflow management
  - name: Users
    description: User account management
  - name: Delegations
    description: Temporary delegation of approval authority
  - name: Documents
    description: Document upload and management
  - name: Reports
    description: Analytics and reporting endpoints

paths:
  # ============== Authentication ==============
  # The application is an OAuth 2.1 / OpenID Connect provider (Spring Authorization Server).
  # The browser client `award-web` is public and uses the authorization code flow with PKCE.
  /oauth2/authorize:
    get:
      tags: [Authentication]
      summary: Start the authorization code flow
      description: |
        Redirects an anonymous user to the login page (`/login`, Ukrainian by default, `?lang=en` for English)
        and, once authenticated, back to `redirect_uri` with `code` and `state`.
      operationId: authorize
      parameters:
        - { name: response_type, in: query, required: true, schema: { type: string, enum: [code] } }
        - { name: client_id, in: query, required: true, schema: { type: string, example: award-web } }
        - { name: redirect_uri, in: query, required: true, schema: { type: string, format: uri } }
        - { name: scope, in: query, required: true, schema: { type: string, example: openid profile } }
        - { name: state, in: query, required: true, schema: { type: string } }
        - { name: code_challenge, in: query, required: true, schema: { type: string } }
        - { name: code_challenge_method, in: query, required: true, schema: { type: string, enum: [S256] } }
      responses:
        '302':
          description: Redirect to the login page or to `redirect_uri` with the authorization code

  /oauth2/token:
    post:
      tags: [Authentication]
      summary: Exchange a code or refresh token for tokens
      description: |
        `grant_type=authorization_code` with `code`, `redirect_uri`, `client_id` and `code_verifier`, or
        `grant_type=refresh_token` with `refresh_token` and `client_id`. Refresh tokens rotate on every use;
        presenting a rotated token again revokes the whole authorization.
      operationId: token
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid grant or request (`error` is `invalid_grant`, `invalid_request` or `invalid_client`)
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /oauth2/revoke:
    post:
      tags: [Authentication]
      summary: Revoke a refresh or access token
      operationId: revokeToken
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [token, client_id]
              properties:
                token: { type: string }
                token_type_hint: { type: string, enum: [refresh_token, access_token] }
                client_id: { type: string }
      responses:
        '200':
          description: Token revoked (also returned for unknown tokens)

  /oauth2/jwks:
    get:
      tags: [Authentication]
      summary: Public keys used to verify token signatures (RS256)
      operationId: jwks
      responses:
        '200':
          description: JSON Web Key Set

  /.well-known/openid-configuration:
    get:
      tags: [Authentication]
      summary: OpenID Connect discovery document
      operationId: discovery
      responses:
        '200':
          description: Endpoint locations and supported features

  /connect/logout:
    get:
      tags: [Authentication]
      summary: End the server session (OpenID Connect RP-initiated logout)
      operationId: logout
      parameters:
        - { name: id_token_hint, in: query, required: true, schema: { type: string } }
        - { name: post_logout_redirect_uri, in: query, schema: { type: string, format: uri } }
      responses:
        '302':
          description: Session ended; redirect to `post_logout_redirect_uri`

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register an employee account
      description: |
        Open endpoint. Like every `/auth/**` endpoint, `/oauth2/token` and `/login`, it is limited to 20 requests per
        minute per client address; the 21st answers 429 with `Retry-After` (`urn:awards:problem:too-many-requests`).
        Every response carries `X-Correlation-Id` (a caller-supplied UUID is kept). Requires an institutional address (`@chnu.edu.ua`), a password of at least 10 characters and
        at most 72 bytes that is not on the common-password list, names made of letters, and an active department.
        Addresses are stored lower-case. The account is created `PENDING` with no role at all and a verification
        email (24-hour link) is sent; the first role is granted by somebody who may manage the department
        (membership confirmation), so a freshly verified account carries no roles or permissions in its token.
        Registering an address that already has a `PENDING` account whose newest verification link has expired
        replaces that account (name, organisation, password, fresh link) and answers 201.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created, verification email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '400':
          description: Malformed body (bean validation)
        '409':
          description: |
            Address already registered (`urn:awards:problem:email-taken`); a `PENDING` account whose
            verification link is still valid answers 409 as well
        '422':
          description: |
            `urn:awards:problem:institutional-email-required`, `organisation-invalid`,
            `password-too-short`, `password-too-long` or `password-too-common`

  /auth/verify-email:
    post:
      tags: [Authentication]
      summary: Confirm an address with the token from the email link and the registration password
      description: |
        The password chosen at registration must be presented with the token, so that only the person who
        registered can activate the account; a wrong password leaves the token usable.
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenWithPasswordRequest'
      responses:
        '200':
          description: Account is now `ACTIVE`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '403':
          description: Password differs from the one chosen at registration (`urn:awards:problem:password-mismatch`)
        '409':
          description: Account is not awaiting verification (`urn:awards:problem:account-not-pending`)
        '410':
          description: Token unknown, expired or already used (`urn:awards:problem:token-invalid`)

  /auth/resend-verification:
    post:
      tags: [Authentication]
      summary: Send a fresh verification link
      description: Always answers 202 for known and unknown addresses; at most one email per address per minute.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted
        '429':
          description: An email was sent within the last minute (`urn:awards:problem:too-many-requests`)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until another request is accepted (also `retryAfter` in the body)

  /auth/password-reset/request:
    post:
      tags: [Authentication]
      summary: Send a password reset link
      description: |
        Always answers 202 so the response does not reveal whether an address is registered. An `ACTIVE` account
        receives an email with a 1-hour single-use link; pending, disabled and unknown addresses receive nothing.
        At most one email per address per minute; further requests inside the interval are accepted silently.
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202':
          description: Accepted

  /auth/password-reset/confirm:
    post:
      tags: [Authentication]
      summary: Set a new password with the token from the email link
      description: |
        Replaces the password hash (BCrypt strength 12), marks the token used and revokes every authorization of
        the user, so each signed-in browser has to log in again with the new password.
      operationId: confirmPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenWithPasswordRequest'
      responses:
        '204':
          description: Password changed, all sessions revoked
        '409':
          description: Account is not `ACTIVE` (`urn:awards:problem:account-not-active`)
        '410':
          description: Token unknown, expired or already used (`urn:awards:problem:token-invalid`)
        '422':
          description: |
            `urn:awards:problem:password-too-short`, `password-too-long`, `password-too-common` or
            `password-same-as-current`

  /auth/email-change/confirm:
    post:
      tags: [Authentication]
      summary: Confirm a sign-in address change with the token from the email link
      description: |
        Open without a token, so the link works in any browser. Moves the account to the address the link was
        sent to (stored lower-case), marks the token used, cancels the user's other address-change and
        password-reset links, and signs the user out everywhere: authorizations deleted, login sessions
        expired, access tokens refused from this second. The previous address receives a notice naming the new
        one. `EMAIL_CHANGED` is written to the audit log with both addresses.
      operationId: confirmEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeConfirmRequest'
      responses:
        '200':
          description: Address changed; sign in with the new one
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailChangeResponse'
        '409':
          description: |
            The address was registered by another account since the request (`urn:awards:problem:email-taken`)
            or the account is not `ACTIVE` (`account-not-active`); the account keeps its address
        '410':
          description: Token unknown, expired, already used or replaced by a newer request (`urn:awards:problem:token-invalid`)

  /auth/security/revoke:
    post:
      tags: [Authentication]
      summary: Deny a sign-in reported by a new-device email ("This was not me")
      description: |
        Takes the 24-hour single-use token from the "New sign-in" email. Revokes every authorization and login
        session of the user, cancels the user's other unused "not me" links, forgets all known devices, replaces
        the current password with an unusable one and emails a 1-hour password-reset link. The account stays `ACTIVE`; `SECURITY_REVOKE` is written to the
        audit log.
      operationId: revokeAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '204':
          description: Sessions revoked, reset link sent
        '410':
          description: Token unknown, expired or already used (`urn:awards:problem:token-invalid`)

  # ============== Organisations ==============
  /organizations:
    get:
      tags: [Users]
      summary: List active organisations of one level with their parent
      description: Open endpoint, used by the registration form to pick a department.
      operationId: listOrganizations
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [UNIVERSITY, COLLEGE, FACULTY, SPECIALITY, DEPARTMENT]
            default: DEPARTMENT
      responses:
        '200':
          description: Organisations ordered by English name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationSummary'

  # ============== Awards ==============
  /award-categories:
    get:
      tags: [Awards]
      summary: Award category catalogue
      description: >
        Active categories as a tree, roots and children in display order. The answer carries
        `Cache-Control: max-age=3600` and an `ETag`; a request with a matching `If-None-Match` answers 304.
      security:
        - bearerAuth: []
      operationId: listAwardCategories
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Category tree
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AwardCategory'
        '304':
          description: The caller's copy is current
        '401':
          $ref: '#/components/responses/Unauthorized'

  /award-categories/suggestions:
    get:
      tags: [Awards]
      summary: Category suggestions for an award being entered
      description: >
        Up to three active categories ranked by score (`award:create`). Rules: category and level keywords
        found in the title or the awarding organisation (`KEYWORD`), the level of the university unit the
        awarding organisation names (`ORGANISATION`) and, with the lowest weight, the caller's most used
        categories (`HISTORY`, only the caller's own awards are read). An input shorter than three characters
        is ignored; with both ignored the list is empty.
      security:
        - bearerAuth: []
      operationId: suggestAwardCategories
      parameters:
        - name: title
          in: query
          required: false
          description: Award title in either language
          schema:
            type: string
        - name: organization
          in: query
          required: false
          description: Awarding organisation
          schema:
            type: string
      responses:
        '200':
          description: Suggestions, the best first
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/CategorySuggestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /awards:
    get:
      tags: [Awards]
      summary: List own awards
      description: >
        The caller's own awards in every status, newest first, each with its request once submitted
        (`award:read:own`). Page size is capped at 100.
      security:
        - bearerAuth: []
      operationId: listAwards
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AwardStatus'
        - name: category
          in: query
          schema:
            type: integer
            format: int64
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated award list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Awards]
      summary: Create an award draft
      description: >
        Creates a `DRAFT` owned by the caller in the caller's department (`award:create`). A title in one
        language is enough; fields that are present are checked (lengths, active category, `http`/`https` link,
        award date not after today in Europe/Kyiv). Surrounding spaces are removed and blank texts count as empty.
      security:
        - bearerAuth: []
      operationId: createAward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardCreateRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
          headers:
            Location:
              schema:
                type: string
              description: URL of created resource
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Without `award:create` (`urn:awards:problem:access-denied`); the refusal is audited
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          $ref: '#/components/responses/ValidationFailed'

  /awards/{id}:
    get:
      tags: [Awards]
      summary: Get award by ID
      description: >
        The owner always gets the award. A holder of `award:read:department`, `award:read:faculty` or
        `award:read:all` gets a submitted award whose organisation lies in the scope of a role granting that
        permission. Anybody else, and anybody but the owner for a `DRAFT`, gets 404.
      security:
        - bearerAuth: []
      operationId: getAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      responses:
        '200':
          description: Award details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Awards]
      summary: Replace the fields of an own draft
      description: >
        Full form with the `version` last read (`award:update:own`). A draft keeps a category deactivated after
        it was chosen; choosing a deactivated category answers 422.
      security:
        - bearerAuth: []
      operationId: updateAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardUpdateRequest'
      responses:
        '200':
          description: Draft updated, with its new version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/AwardConflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'

    delete:
      tags: [Awards]
      summary: Delete an own draft
      description: Deletes the caller's draft (`award:read:own`); the audit trigger keeps the old values.
      security:
        - bearerAuth: []
      operationId: deleteAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      responses:
        '204':
          description: Draft deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The award was submitted (`urn:awards:problem:award-not-editable`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ============== Workflows ==============
  /awards/{id}/submit:
    post:
      tags: [Workflows]
      summary: Submit an own draft for approval
      description: >
        Checks completeness (category, awarding organisation, award date) and the field rules, then in one
        transaction sets the award `PENDING` with the level base score, creates its request (`SUBMITTED` at
        `FACULTY_SECRETARY`) and writes an `AWARD_SUBMITTED` audit row. The organisation is refreshed from the
        owner's department. The draft row is locked, so a repeated submission answers 409 (`award:create`).
        A draft that looks like another award of the owner (same date, similar title) is submitted only with
        `acknowledgeDuplicate: true`, and the audit row then records `duplicateAcknowledged`.
      security:
        - bearerAuth: []
      operationId: submitAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      requestBody:
        required: false
        description: Optional in the signature, but `version` is required; a missing body answers 422 on `version`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardSubmitRequest'
      responses:
        '200':
          description: Award submitted for review, with its request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            `urn:awards:problem:award-stale`, `award-not-editable`, or `award-possible-duplicate` listing the
            similar own awards in `matches` when the submission was not acknowledged; nothing is changed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: >
            `urn:awards:problem:award-incomplete` naming each empty field in `errors`, or `validation-failed`
            (category no longer available, date in the future or more than 50 years ago, `version` missing)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /awards/{id}/status:
    get:
      tags: [Awards]
      summary: Review status of an award
      description: >
        The review timeline of an award: the approval path with the state and due date of every level, the
        deadline of the current level, the expected completion (a Kyiv date, null for a returned or final
        request), whether the review is overdue and why it is delayed, and the reviewer decisions oldest first
        with their comments. Readable by the owner (any status) and by readers whose scope covers the award's
        organisation (submitted awards only), as `GET /awards/{id}`; a draft answers without a request. Other
        drafts, awards out of scope and unknown ids answer 404. Clients poll it at most once a minute.
      security:
        - bearerAuth: []
      operationId: getAwardStatus
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      responses:
        '200':
          description: The review timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardStatusView'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /awards/{id}/versions:
    get:
      tags: [Awards]
      summary: Saved versions of an award
      description: >
        Every saved state of the award, newest first, with the fields that differ from the previous version.
        The owner sees all versions (`award:read:own`); a reader whose scope covers the award's organisation
        sees a submitted award from its first `SUBMITTED` version on (or its `BASELINE` for awards submitted
        before versioning), and that first version lists no changes. Drafts of others, awards out of scope and
        unknown ids answer 404.
      security:
        - bearerAuth: []
      operationId: listAwardVersions
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
        - $ref: '#/components/parameters/PageParam'
        - name: size
          in: query
          description: Page size; values outside 1..50 are clamped, not rejected
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: Page of versions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardVersionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /awards/{id}/audit-trail:
    get:
      tags: [Awards]
      summary: Audit trail of an award
      description: >
        The `audit_logs` rows about the award, newest first: trigger rows of `awards` and of its
        `award_requests` row, and application rows such as `AWARD_SUBMITTED`. Also answers for a deleted draft
        while rows about it exist; 404 when nothing about the id was ever logged (`audit:read`; a refusal is
        audited as `ACCESS_DENIED`).
      security:
        - bearerAuth: []
      operationId: getAwardAuditTrail
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Page of audit rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditTrailPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /awards/{id}/audit-trail/export:
    get:
      tags: [Awards]
      summary: Audit trail of an award as CSV
      description: >
        The newest 10 000 rows of the audit trail as a UTF-8 file with a byte order mark, `;` as separator and
        CRLF line ends. Columns: `time` (UTC, ISO-8601), `actor_id`, `actor_email`, `action`, `entity_type`,
        `entity_id`, `changed_fields` (comma-separated), `old_values` and `new_values` (JSON, empty when absent),
        `ip_address`, `correlation_id`. Cells starting with `=`, `+`, `-`, `@`, tab or carriage return are
        prefixed with `'`. Every export is audited as `AUDIT_EXPORT` (`audit:read`; a refusal is audited as
        `ACCESS_DENIED`).
      security:
        - bearerAuth: []
      operationId: exportAwardAuditTrail
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      responses:
        '200':
          description: The file, as attachment `award-{id}-audit-{yyyy-MM-dd}.csv` (Kyiv date), not cached
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="award-42-audit-2026-09-30.csv"
            X-Audit-Truncated:
              description: Present with `true` when older rows were left out
              schema:
                type: string
                enum: ['true']
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /awards/{id}/approve:
    post:
      tags: [Workflows]
      summary: Approve award at current level (planned, Epic 4)
      x-status: planned
      security:
        - bearerAuth: []
      operationId: approveAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Award approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /awards/{id}/reject:
    post:
      tags: [Workflows]
      summary: Reject award (planned, Epic 4)
      x-status: planned
      security:
        - bearerAuth: []
      operationId: rejectAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionRequest'
      responses:
        '200':
          description: Award rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /awards/{id}/return:
    post:
      tags: [Workflows]
      summary: Return award for revision (planned, Epic 4)
      x-status: planned
      security:
        - bearerAuth: []
      operationId: returnAward
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
      responses:
        '200':
          description: Award returned for revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'

  # ============== Documents ==============
  /awards/{id}/documents:
    get:
      tags: [Documents]
      summary: List the documents of an award
      description: >
        The documents of an award the caller may read (the owner in any status; a holder of an `award:read:*`
        scope covering the award's organisation once it is submitted), oldest first. Anyone else, or an unknown
        award, gets 404 (`award:read:own`).
      security:
        - bearerAuth: []
      operationId: listAwardDocuments
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      responses:
        '200':
          description: Document list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Documents]
      summary: Attach a file to an own draft
      description: >
        Stores the file in the private document bucket under `awards/<awardId>/<random UUID>`, encrypted at rest,
        and its metadata in `documents` (`processing_status` `PENDING`). The format is taken from the leading
        bytes of the content (PDF, JPEG, PNG, WEBP), never from the name or the part's `Content-Type`; the file
        name keeps its last path segment without control characters, gets the extension of its content when it
        has none or an unknown one, and is shortened to 255 characters. At most 10 MB per file and 10 documents
        per award, one copy of a file per award, 50 MB of documents and 20 uploads a minute per user. Every file
        is scanned by ClamAV after the size check and before the type check; an infected file is refused and
        recorded as `DOCUMENT_REJECTED`, and an unreachable scanner refuses the upload. The draft row is locked,
        so uploads, deletions and the submission of one award run one after the other (`award:update:own`).
      security:
        - bearerAuth: []
      operationId: uploadDocument
      parameters:
        - $ref: '#/components/parameters/AwardIdParam'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, type]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF, JPEG, PNG or WEBP, at most 10 485 760 bytes
                type:
                  $ref: '#/components/schemas/DocumentType'
                description:
                  type: string
                  maxLength: 500
      responses:
        '201':
          description: Document stored
          headers:
            Location:
              description: Download path of the document (`/api/v1/documents/{id}`)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: >
            `urn:awards:problem:empty-file`, `unsupported-type` (content is not PDF, JPEG, PNG or WEBP),
            `content-mismatch` (the extension names another supported format), `missing-parameter` (`file` or
            `type`), `invalid-parameter` (unknown `type`, description over 500 characters, non-numeric id)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >
            `urn:awards:problem:award-not-editable` (the award was submitted), `document-limit` (10 documents,
            with `limit`), `duplicate-document` (the same file is attached, with `documentId`), `storage-quota`
            (the caller's documents would exceed 50 MB, with `quota` and `used` in bytes)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '413':
          description: >
            `urn:awards:problem:file-too-large`: the file is over 10 MB or the request over the 11 MB multipart
            limit, with the file limit in `maxSize` (bytes); nothing is stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: >
            `urn:awards:problem:malware-detected`: the scanner found malicious code; nothing is stored and a
            `DOCUMENT_REJECTED` audit row names the signature
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '429':
          description: >
            `urn:awards:problem:too-many-requests`: more than 20 uploads by the caller in the current minute, with
            `retryAfter` in seconds
          headers:
            Retry-After:
              description: Seconds until the next minute window
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: >
            `urn:awards:problem:storage-unavailable`: the object storage did not answer; no row is written.
            `scanner-unavailable`: the malware scanner did not answer within 30 s or reported an error; nothing
            is stored
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /documents/{id}:
    get:
      tags: [Documents]
      summary: Download a document
      description: >
        Streams the content of a document of an award the caller may read (same rule as the list) and records a
        `DOCUMENT_DOWNLOAD` audit row. The response is an attachment that is neither rendered inline nor cached:
        `Content-Disposition: attachment; filename*=UTF-8''<encoded name>`, `X-Content-Type-Options: nosniff`,
        `Cache-Control: no-store, private`, `Content-Security-Policy: sandbox`. There is no pre-signed storage
        URL (`award:read:own`).
      security:
        - bearerAuth: []
      operationId: downloadDocument
      parameters:
        - $ref: '#/components/parameters/DocumentIdParam'
      responses:
        '200':
          description: Document file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >
            `urn:awards:problem:document-not-found` (unknown, or its award is not readable by the caller) or
            `document-content-missing` (the row exists, its object is gone; logged as an error)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '503':
          description: "`urn:awards:problem:storage-unavailable`"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      tags: [Documents]
      summary: Remove a document from an own draft
      description: >
        Deletes the row; its object is removed after the commit (a failed removal is left to the daily sweep of
        orphaned objects). Documents of a submitted award are kept (`award:update:own`).
      security:
        - bearerAuth: []
      operationId: deleteDocument
      parameters:
        - $ref: '#/components/parameters/DocumentIdParam'
      responses:
        '204':
          description: Document deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: "`urn:awards:problem:document-not-found`: unknown, or its award is not the caller's"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: "`urn:awards:problem:award-not-editable`: the award was submitted"
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ============== Users ==============
  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      security:
        - bearerAuth: []
      operationId: getCurrentUser
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    patch:
      tags: [Users]
      summary: Correct the caller's first and last name
      description: |
        Absent or null fields stay as they are; names are trimmed and follow the registration rules. Any other
        property is refused with 422 (`code: not-allowed`) instead of being ignored. A change writes
        `PROFILE_UPDATED` to the audit log with the old and new values of the changed fields only; a request
        that changes nothing answers 200 without an audit row. A write colliding with a concurrent change of
        the account is retried once.
      security:
        - bearerAuth: []
      operationId: updateCurrentUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Profile after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          description: The account changed twice under the write (`urn:awards:problem:concurrent-update`)
        '422':
          description: |
            `urn:awards:problem:validation-failed`; `errors[]` names each field with `required`, `too-long`,
            `invalid` or `not-allowed`

  /users/me/email-change:
    post:
      tags: [Users]
      summary: Request a change of the sign-in address
      description: |
        Sends a 1-hour single-use link to the new address and cancels the caller's earlier unused links. The
        current password is required; a wrong one counts as a failed sign-in, and the failure that locks the
        account also signs it out everywhere and cancels pending links. At most one request per account per
        minute. The current address receives a warning naming the new one; a password reset, a "this was not me"
        revocation or a lockout cancels the pending change. `EMAIL_CHANGE_REQUESTED` is written to the audit log.
      security:
        - bearerAuth: []
      operationId: requestEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailChangeRequest'
      responses:
        '202':
          description: Link sent to the new address
        '400':
          description: Malformed body (bean validation)
        '403':
          description: Wrong current password (`urn:awards:problem:password-mismatch`)
        '409':
          description: The address belongs to another account (`urn:awards:problem:email-taken`)
        '422':
          description: |
            Not an institutional address (`urn:awards:problem:institutional-email-required`) or the current
            address (`validation-failed`, field `newEmail`, code `unchanged`)
        '423':
          description: |
            The current address is locked after five failed sign-ins (`urn:awards:problem:account-locked`);
            the password is not checked
        '429':
          description: A link was sent within the last minute (`urn:awards:problem:too-many-requests`)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until another request is accepted (also `retryAfter` in the body)

  /users/me/export:
    get:
      tags: [Users]
      summary: Download my data (GDPR Article 20)
      description: |
        Everything the system holds about the caller as one JSON attachment, built synchronously
        (PRIVACY_BY_DESIGN §6.2). Property names are snake_case; sections without entries are empty arrays.
        Never contains the password hash, one-time tokens, authorization-server records, audit row snapshots or
        other people's data beyond the name of a delegation's other party. IP addresses are the caller's own and
        are included; activity rows anybody can cause against an account (failed sign-ins, reset requests,
        lockouts) or another person caused (roles, delegations) carry `ip_address: null`. At most one export per
        account per minute. `DATA_EXPORT` (`entity_type` `GDPR`) is audited with the section counts and a notice
        with time, IP and browser is emailed to the account after commit.
      security:
        - bearerAuth: []
      operationId: exportMyData
      responses:
        '200':
          description: The export file
          headers:
            Content-Disposition:
              description: '`attachment; filename="award-monitoring-export-<yyyy-MM-dd>.json"` (Kyiv date)'
              schema:
                type: string
            Cache-Control:
              description: '`no-store`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalDataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: An export was made within the last minute (`urn:awards:problem:too-many-requests`)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until another request is accepted (also `retryAfter` in the body)

  /users:
    get:
      tags: [Users]
      summary: User directory
      description: |
        Everybody for `user:read:all`; for `user:read:scope` only members of the organisations inside the
        caller's role scopes. Unverified accounts never appear. Sorted by last name, first name.
      security:
        - bearerAuth: []
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - name: organization
          in: query
          description: Limit to this organisation and its descendants; must lie inside the caller's scope
          schema:
            type: integer
            format: int64
        - name: role
          in: query
          description: Holders of the role today
          schema:
            $ref: '#/components/schemas/UserRole'
        - name: status
          in: query
          description: Without it, every status except `PENDING` and `DELETED`, which are never listed
          schema:
            $ref: '#/components/schemas/AccountStatus'
        - name: unconfirmed
          in: query
          description: Only users who have never held a role
          schema:
            type: boolean
            default: false
        - name: q
          in: query
          description: Case-insensitive fragment of the name or address; ignored under two characters
          schema:
            type: string
      responses:
        '200':
          description: One page; `size` is capped at 100
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '403':
          description: |
            `urn:awards:problem:access-denied` — the caller lacks `user:read:all`/`user:read:scope`, or
            `organization` is outside the caller's scope; the `detail` names what is missing
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{id}:
    get:
      tags: [Users]
      summary: One user with the role history
      security:
        - bearerAuth: []
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Unknown, unverified, deleted, or outside the caller's scope (the directory does not confirm foreign ids)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{id}/roles:
    post:
      tags: [Users]
      summary: Grant a role to a user
      description: |
        Needs `user:manage` (any role anywhere) or `user:manage:scope` (a role strictly below one the caller
        holds, in an organisation inside that role's subtree). The target must be `ACTIVE` and must not already
        hold the role in that organisation today. Granting `EMPLOYEE` with `updateOrganization` is the
        membership confirmation of a self-registered account: the user's primary organisation is corrected to
        `organizationId` and a current `EMPLOYEE` role in the previous department is revoked in the same
        request. For a user who has already held a role the same request moves them to another department;
        it must then carry `fromOrganizationId`, and delegations the user received for organisations in which
        they no longer hold any current role are revoked. The new role reaches the user's token with the next
        silent refresh or sign-in.
      security:
        - bearerAuth: []
      operationId: assignRole
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleAssignmentRequest'
      responses:
        '201':
          description: The assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAssignment'
        '400':
          description: Malformed body (bean validation)
        '403':
          description: |
            `urn:awards:problem:access-denied` without the permission, or
            `urn:awards:problem:role-above-level` when the role is not below the caller's level in that
            organisation (university and system roles are granted by the rector's office or the administrator)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Unknown user, or outside the caller's scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            `urn:awards:problem:role-already-assigned` — the user already holds the role in that organisation;
            `membership-already-confirmed` — `updateOrganization` for a user who has already held a role
            without `fromOrganizationId`, or with one that is no longer the user's organisation (a stale
            confirmation)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            `urn:awards:problem:role-organization-mismatch` (the organisation type does not fit the role),
            `organisation-invalid` (unknown or inactive), `user-not-active`, `role-validity`, or
            `membership-role-required` when `updateOrganization` is sent with a role other than `EMPLOYEE`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /users/{id}/roles/{roleId}:
    delete:
      tags: [Users]
      summary: Revoke a role
      description: |
        Allowed to callers who could have granted the role. Nothing is deleted: `validTo` becomes yesterday, so
        the history stays readable. The target's sessions and tokens are ended everywhere, so the lost
        permissions take effect at once. A caller cannot revoke their own last role above `EMPLOYEE`.
      security:
        - bearerAuth: []
      operationId: revokeRole
      parameters:
        - $ref: '#/components/parameters/UserIdParam'
        - name: roleId
          in: path
          required: true
          description: Assignment identifier
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Revoked
        '403':
          description: |
            `urn:awards:problem:access-denied`, `role-above-level`, or `role-last-own` when the caller would
            strip their own last role above `EMPLOYEE`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Unknown user or assignment, or outside the caller's scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            `urn:awards:problem:role-already-revoked` — the assignment has already ended, or was taken back
            before it started
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'


  # ============== Delegations ==============
  /delegations:
    get:
      tags: [Delegations]
      summary: Delegations given and received by the caller
      description: |
        Approval authority the caller handed to somebody else and authority handed to the caller, newest
        first. `state` narrows the list; without it every state is returned. A holder of `user:manage` may
        pass `delegatorId` to read another person's page.
      security:
        - bearerAuth: []
      operationId: listDelegations
      parameters:
        - name: state
          in: query
          required: false
          description: Only delegations in this state
          schema:
            $ref: '#/components/schemas/DelegationState'
        - name: delegatorId
          in: query
          required: false
          description: Read this user's page instead of your own; `user:manage` only
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Delegations given and received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DelegationList'
        '403':
          description: |
            `urn:awards:problem:access-denied` — `delegatorId` without `user:manage`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags: [Delegations]
      summary: Delegate approval authority
      description: |
        Hands one approval role the caller currently holds (`FACULTY_SECRETARY`, `DEAN`, `RECTOR_SECRETARY`,
        `RECTOR`) to a colleague for a bounded period of at most 90 days. The delegate receives the role's
        `award:read:*` and `award:approve:*` permissions only — never user management — and cannot pass them
        on. The authority reaches the delegate's token with the next silent refresh or sign-in and disappears
        by itself after `validTo`.
      security:
        - bearerAuth: []
      operationId: createDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DelegationRequest'
      responses:
        '201':
          description: The delegation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Delegation'
        '400':
          description: Malformed body (bean validation)
        '403':
          description: |
            `urn:awards:problem:access-denied` — the caller holds no approval role
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Unknown delegate, or outside the caller's scope
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '422':
          description: |
            `urn:awards:problem:delegation-not-holder` (the caller does not hold that role in that
            organisation today, or holds it only by delegation), `delegation-bad-delegate` (the delegate is
            the caller, is not `ACTIVE`, or holds no current role inside the organisation's subtree),
            `delegation-period` (`validTo` before `validFrom`, in the past, or more than 90 days after
            `validFrom`), `delegation-overlap` (the caller already delegated that role in that organisation
            for part of the period), or `organisation-invalid`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /delegations/{id}:
    delete:
      tags: [Delegations]
      summary: Revoke a delegation
      description: |
        Allowed to the delegator, to `user:manage`, and to anybody who could revoke the delegator's role.
        Anybody else is answered 404, so the endpoint does not confirm that a delegation exists or say what
        state it is in. Nothing is deleted: `revokedAt` and `revokedBy` are recorded. The delegate's sessions
        and tokens are ended everywhere, so the borrowed authority stops at once.
      security:
        - bearerAuth: []
      operationId: revokeDelegation
      parameters:
        - name: id
          in: path
          required: true
          description: Delegation identifier
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Revoked
        '404':
          description: |
            Unknown delegation, or one the caller may not end
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '409':
          description: |
            `urn:awards:problem:delegation-not-active` — already revoked or expired; of two revocations arriving
            at once, the second (the row is locked while the first runs)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
  # ============== Reports ==============
  /reports/awards/summary:
    get:
      tags: [Reports]
      summary: Awards summary statistics (planned, Epic 5)
      x-status: planned
      security:
        - bearerAuth: []
      operationId: getAwardsSummary
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum: [week, month, quarter, year]
            default: month
      responses:
        '200':
          description: Summary statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AwardsSummary'

  /reports/awards/export:
    get:
      tags: [Reports]
      summary: Export awards data (planned, Epic 5)
      x-status: planned
      security:
        - bearerAuth: []
      operationId: exportAwards
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [csv, xlsx, pdf]
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Export file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ============== Health ==============
  /actuator/health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by /oauth2/token

  parameters:
    PageParam:
      name: page
      in: query
      description: Page number (0-based); a negative value is read as 0
      schema:
        type: integer
        default: 0
        minimum: 0

    SizeParam:
      name: size
      in: query
      description: Page size; values outside 1..100 are clamped, not rejected
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100

    SortParam:
      name: sort
      in: query
      description: Sort field and direction (e.g., createdAt,desc)
      schema:
        type: string

    AwardIdParam:
      name: id
      in: path
      required: true
      description: >
        Award identifier; a value that is not a 64-bit integer answers 400 `urn:awards:problem:invalid-parameter`
        naming the parameter
      schema:
        type: integer
        format: int64

    DocumentIdParam:
      name: id
      in: path
      required: true
      description: >
        Document identifier; a value that is not a 64-bit integer answers 400
        `urn:awards:problem:invalid-parameter` naming the parameter
      schema:
        type: integer
        format: int64

    UserIdParam:
      name: id
      in: path
      required: true
      description: User identifier
      schema:
        type: integer
        format: int64

  schemas:
    # Auth
    TokenRequest:
      type: object
      required: [grant_type, client_id]
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        client_id:
          type: string
          example: award-web
        code:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
        refresh_token:
          type: string

    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: |
            RS256-signed JWT with `sub`, `email`, `name`, `roles`, `role_scopes` (`ROLE:orgId` per current
            assignment), `permissions`, `org_id`, `org_type`, `iat_ms` (issue instant in epoch milliseconds, as a string)
        refresh_token:
          type: string
        id_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires
          example: 900
        scope:
          type: string
          example: openid profile

    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName, organizationId]
      properties:
        email:
          type: string
          format: email
          example: anastasia.k@chnu.edu.ua
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 72
        firstName:
          type: string
          maxLength: 100
        lastName:
          type: string
          maxLength: 100
        organizationId:
          type: integer
          format: int64
          description: Department the employee belongs to

    RevokeRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Raw token from the "New sign-in" email

    TokenWithPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: Raw token from the email link
        password:
          type: string
          format: password
          maxLength: 72
          description: Registration password when confirming an address; the new password when resetting it

    RegistrationResponse:
      type: object
      properties:
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/AccountStatus'

    OrganizationSummary:
      allOf:
        - $ref: '#/components/schemas/OrganizationRef'
        - type: object
          properties:
            parent:
              $ref: '#/components/schemas/OrganizationRef'

    # User
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleAssignment'
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        faculty:
          description: Faculty or college above `organization`; null when there is none
          oneOf:
            - $ref: '#/components/schemas/OrganizationRef'
            - type: 'null'
        status:
          $ref: '#/components/schemas/AccountStatus'
        createdAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
        membershipConfirmed:
          type: boolean
          description: |
            Whether somebody has ever granted the user a role; false until the department confirms a
            self-registered account, which is why the token carries no roles or permissions

    AccountStatus:
      type: string
      enum: [PENDING, ACTIVE, INACTIVE, SUSPENDED, RETIRED, MEMORIAL, DELETED]

    RoleAssignment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/UserRole'
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        validFrom:
          type: string
          format: date
        validTo:
          type: [string, 'null']
          format: date

    RoleAssignmentRequest:
      type: object
      required: [role, organizationId]
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        organizationId:
          type: integer
          format: int64
          description: |
            Where the role applies. `EMPLOYEE` needs a department, `DEAN` a faculty or college,
            `FACULTY_SECRETARY` a faculty or a department, and `RECTOR`, `RECTOR_SECRETARY`, `SYSTEM_ADMIN`
            and `GDPR_OFFICER` the university
        validFrom:
          type: string
          format: date
          description: First day the role applies; today when omitted, never in the past
        validTo:
          type: [string, 'null']
          format: date
          description: Last day the role applies; open-ended when omitted
        updateOrganization:
          type: boolean
          default: false
          description: |
            Membership confirmation: move the user's primary organisation to `organizationId` and revoke a
            current `EMPLOYEE` role in the previous department. Only with `role: EMPLOYEE`
        fromOrganizationId:
          type: [integer, 'null']
          format: int64
          description: |
            The user's current organisation as the caller saw it. Required with `updateOrganization` for a
            user who has already held a role (a department move); ignored for a first confirmation

    UserRole:
      type: string
      enum:
        - EMPLOYEE
        - FACULTY_SECRETARY
        - DEAN
        - RECTOR_SECRETARY
        - RECTOR
        - SYSTEM_ADMIN
        - GDPR_OFFICER

    UserUpdateRequest:
      type: object
      additionalProperties: false
      description: Notification preferences join this request with the notification channels (Epic 7)
      properties:
        firstName:
          type: string
          maxLength: 100
          description: Letters, apostrophes, hyphens and spaces, starting with a letter; trimmed
        lastName:
          type: string
          maxLength: 100
          description: Same rules as `firstName`

    EmailChangeRequest:
      type: object
      required: [newEmail, currentPassword]
      properties:
        newEmail:
          type: string
          format: email
          maxLength: 254
          description: Institutional address to sign in with
        currentPassword:
          type: string
          format: password
          maxLength: 72

    PersonalDataExport:
      type: object
      description: GDPR Article 20 export, format version 1.1; every list is present, possibly empty
      required: [export_metadata, personal_data, roles, delegations, awards, award_versions, documents,
                 consent_history, devices, activity_log]
      properties:
        export_metadata:
          type: object
          description: '`export_date` (instant), `user_id`, `format_version` (`1.1`), `gdpr_article`'
        personal_data:
          type: object
          description: |
            `profile`: `email`, `first_name`, `last_name`, `department` and `faculty` (`id`, `name`, `name_uk`),
            `account_status`, `created_at`, `last_login_at`
        roles:
          type: array
          description: '`role`, `organization`, `valid_from`, `valid_to`, `current`'
          items:
            type: object
        delegations:
          type: array
          description: |
            `direction` (`GIVEN`/`RECEIVED`), `other_party` (full name only), `role`, `organization`,
            `valid_from`, `valid_to`, `state`, `reason` (given only), `created_at`, `revoked_at`
          items:
            type: object
        awards:
          type: array
          description: |
            Every own award in every status: `award_id`, `title`, `title_uk`, `description`, `description_uk`,
            `category`, `awarding_organization`, `award_date`, `status`, `external_url`, `organization`,
            `created_at`, `updated_at`
          items:
            type: object
        award_versions:
          type: array
          description: |
            Every saved state of those awards, oldest first per award, without the person who saved it:
            `award_id`, `version`, `action`, `changed_fields`, `created_at`, `snapshot` (`title`, `title_uk`,
            `description`, `description_uk`, `awarding_organization`, `award_date`, `category_id`, `status`,
            `impact_score`, `external_url`, `organization_id`)
          items:
            type: object
        documents:
          type: array
          description: |
            Metadata of the documents of those awards: `document_id`, `award_id`, `file_name`, `file_type`,
            `mime_type`, `file_size`, `uploaded_at`, `api_path`
          items:
            type: object
        consent_history:
          type: array
          description: '`consent_type`, `consent_version`, `granted`, `granted_at`, `withdrawn_at`, `ip_address`, `created_at`'
          items:
            type: object
        devices:
          type: array
          description: '`browser`, `operating_system`, `last_ip_address`, `first_seen_at`, `last_used_at`'
          items:
            type: object
        activity_log:
          type: array
          description: |
            The caller's authentication, authorization, profile and GDPR events, newest first: `action`,
            `timestamp`, `ip_address`
          items:
            type: object

    EmailChangeConfirmRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          maxLength: 100
          description: Raw token from the email link

    EmailChangeResponse:
      type: object
      required: [userId, email]
      properties:
        userId:
          type: integer
          format: int64
          description: The account that moved; a browser signed in as another user keeps its session
        email:
          type: string
          format: email
          description: The address the account signs in with from now on

    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        status:
          $ref: '#/components/schemas/AccountStatus'
        roles:
          type: array
          description: Roles in effect today
          items:
            $ref: '#/components/schemas/RoleAssignment'
        membershipConfirmed:
          type: boolean
          description: Whether somebody has ever granted the user a role

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            createdAt:
              type: string
              format: date-time
            lastLoginAt:
              type: [string, 'null']
              format: date-time
            roleHistory:
              type: array
              description: Every assignment ever made, newest first
              items:
                $ref: '#/components/schemas/RoleAssignment'

    UserPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/UserSummary'

    DelegationState:
      type: string
      description: |
        `active` — in effect today; `upcoming` — starts later; `expired` — its last day has passed;
        `revoked` — taken back before it ended
      enum: [active, upcoming, expired, revoked]

    Delegation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        role:
          $ref: '#/components/schemas/UserRole'
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        delegator:
          $ref: '#/components/schemas/UserBrief'
        delegate:
          $ref: '#/components/schemas/UserBrief'
        validFrom:
          type: string
          format: date
        validTo:
          type: string
          format: date
        reason:
          type: [string, 'null']
        state:
          $ref: '#/components/schemas/DelegationState'
        createdAt:
          type: string
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time

    DelegationRequest:
      type: object
      required: [delegateId, role, organizationId, validFrom, validTo]
      properties:
        delegateId:
          type: integer
          format: int64
          description: Who receives the authority; must be somebody else
        role:
          $ref: '#/components/schemas/UserRole'
        organizationId:
          type: integer
          format: int64
          description: Where the delegated role applies; the caller must hold the role there today
        validFrom:
          type: string
          format: date
          description: First day the authority applies
        validTo:
          type: string
          format: date
          description: Last day the authority applies; at most 90 days after `validFrom`
        reason:
          type: [string, 'null']
          maxLength: 500

    DelegationList:
      type: object
      properties:
        given:
          type: array
          description: Delegations the caller handed out, newest first
          items:
            $ref: '#/components/schemas/Delegation'
        received:
          type: array
          description: Delegations handed to the caller, newest first
          items:
            $ref: '#/components/schemas/Delegation'

    UserBrief:
      type: object
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email

    NotificationPreferences:
      type: object
      properties:
        emailEnabled:
          type: boolean
          default: true
        browserEnabled:
          type: boolean
          default: true

    # Organization
    OrganizationRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameUk:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [UNIVERSITY, COLLEGE, FACULTY, SPECIALITY, DEPARTMENT]

    # Award
    Award:
      type: object
      description: >
        An award of one person. Title, category, awarding organisation and date may be empty while the award is
        a draft; at least one of `title` and `titleUk` is always present (columns relaxed by V020 with the
        award endpoints).
      properties:
        id:
          type: integer
          format: int64
        title:
          type: [string, 'null']
        titleUk:
          type: [string, 'null']
        description:
          type: [string, 'null']
        descriptionUk:
          type: [string, 'null']
        category:
          $ref: '#/components/schemas/AwardCategoryRef'
        awardingOrganization:
          type: [string, 'null']
        awardDate:
          type: [string, 'null']
          format: date
        externalUrl:
          type: [string, 'null']
          format: uri
        status:
          $ref: '#/components/schemas/AwardStatus'
        impactScore:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        owner:
          $ref: '#/components/schemas/UserRef'
        organization:
          $ref: '#/components/schemas/OrganizationRef'
        request:
          $ref: '#/components/schemas/AwardRequestSummary'
        warnings:
          type: array
          description: >
            Hints that do not block saving, computed for the owner's drafts only (empty for a submitted award):
            `RECENT_DATE` when the award date lies within the last 30 days, `POSSIBLE_DUPLICATE` when another
            award of the owner has the same date and a title similarity of at least 0.6
          items:
            $ref: '#/components/schemas/AwardWarning'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          format: int64
          description: Optimistic-lock version, sent back on update and submit

    AwardStatus:
      type: string
      description: Status of the award itself (`awards.status`)
      enum:
        - DRAFT
        - PENDING
        - APPROVED
        - REJECTED
        - ARCHIVED

    RequestStatus:
      type: string
      description: Status of the approval request (`award_requests.status`)
      enum:
        - SUBMITTED
        - IN_REVIEW
        - ESCALATED
        - APPROVED
        - REJECTED
        - RETURNED
        - EXPIRED

    ApprovalLevel:
      type: string
      description: Approval levels in the order a request climbs them
      enum:
        - FACULTY_SECRETARY
        - DEAN
        - RECTOR_SECRETARY
        - RECTOR

    RecognitionLevel:
      type: string
      description: >
        Recognition level of a category. Minimum approval level and impact base score per level are listed in
        DATA_DICTIONARY §2.2.
      enum:
        - SPECIALITY
        - DEPARTMENT
        - COLLEGE
        - FACULTY
        - UNIVERSITY
        - LOCAL
        - REGIONAL
        - NATIONAL
        - INTERNATIONAL

    AwardRequestSummary:
      type: [object, 'null']
      description: The approval request, present once the award is submitted
      properties:
        status:
          $ref: '#/components/schemas/RequestStatus'
        currentLevel:
          $ref: '#/components/schemas/ApprovalLevel'
        submittedAt:
          type: string
          format: date-time
        deadline:
          type: [string, 'null']
          format: date-time
          description: >
            End of the current level's review period: the start moved by the configured number of working days
            (Monday to Friday) at the same Kyiv time. While a level is
            reviewing, derived from the submission when none is stored; for a returned or final request the stored
            value, possibly null. Stays the missed deadline of an overdue level (the revised due date is in
            `AwardStatusView.path`)
        estimatedCompletion:
          type: [string, 'null']
          format: date
          description: >
            Kyiv date the last level of the approval path is expected to finish; null for a returned or final
            request
        overdue:
          type: boolean
          description: Whether the current level is past its deadline

    AwardStatusView:
      type: object
      description: The review timeline of an award; request fields are null for an award without a request
      properties:
        awardId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/AwardStatus'
        requestStatus:
          oneOf:
            - $ref: '#/components/schemas/RequestStatus'
            - type: 'null'
        currentLevel:
          oneOf:
            - $ref: '#/components/schemas/ApprovalLevel'
            - type: 'null'
        submittedAt:
          type: [string, 'null']
          format: date-time
        deadline:
          type: [string, 'null']
          format: date-time
          description: As `AwardRequestSummary.deadline`
        estimatedCompletion:
          type: [string, 'null']
          format: date
        overdue:
          type: boolean
        completedAt:
          type: [string, 'null']
          format: date-time
        rejectionReason:
          type: [string, 'null']
        delay:
          type: [object, 'null']
          description: >
            Why the request is late: `NO_REVIEWER` when nobody currently holds the level's role in a scope
            covering the award's organisation (takes precedence), `REVIEW_OVERDUE` with the missed deadline
          properties:
            reason:
              type: string
              enum: [NO_REVIEWER, REVIEW_OVERDUE]
            since:
              type: [string, 'null']
              format: date-time
        path:
          type: array
          description: Approval levels from the faculty secretary up, lowest first
          items:
            $ref: '#/components/schemas/PathStep'
        decisions:
          type: array
          description: Reviewer decisions, oldest first
          items:
            $ref: '#/components/schemas/ReviewDecisionView'

    PathStep:
      type: object
      properties:
        level:
          $ref: '#/components/schemas/ApprovalLevel'
        state:
          type: string
          enum: [DONE, CURRENT, UPCOMING]
        dueDate:
          type: [string, 'null']
          format: date
          description: Kyiv date the level is expected to finish; null for a done level or an inactive request
        completedAt:
          type: [string, 'null']
          format: date-time
          description: When the level approved or passed the request on

    ReviewDecisionView:
      type: object
      properties:
        id:
          type: integer
          format: int64
        decision:
          type: string
          enum: [APPROVED, REJECTED, ESCALATED, RETURNED]
        level:
          $ref: '#/components/schemas/ApprovalLevel'
        reviewerId:
          type: integer
          format: int64
        reviewerName:
          type: string
        comments:
          type: [string, 'null']
        decidedAt:
          type: string
          format: date-time

    AwardWarning:
      type: object
      properties:
        code:
          type: string
          enum: [RECENT_DATE, POSSIBLE_DUPLICATE]
        field:
          type: string
          description: The field the warning concerns (`awardDate`, `title`)
        matches:
          type: array
          description: Own awards that look the same (POSSIBLE_DUPLICATE only, empty otherwise)
          items:
            $ref: '#/components/schemas/DuplicateMatch'

    DuplicateMatch:
      type: object
      description: An award of the same owner with the same award date and a similar title
      properties:
        id:
          type: integer
          format: int64
        title:
          type: [string, 'null']
        titleUk:
          type: [string, 'null']
        awardDate:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/AwardStatus'

    AwardCategory:
      type: object
      description: A category of the catalogue with its active subcategories
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameUk:
          type: string
        description:
          type: string
        level:
          $ref: '#/components/schemas/RecognitionLevel'
        children:
          type: array
          items:
            $ref: '#/components/schemas/AwardCategory'

    CategorySuggestion:
      type: object
      description: A category suggested for the award being entered
      required: [id, name, level, score, reasons]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameUk:
          type: string
        level:
          $ref: '#/components/schemas/RecognitionLevel'
        score:
          type: integer
          description: Rank of the suggestion, higher first
        reasons:
          type: array
          items:
            type: string
            enum: [KEYWORD, ORGANISATION, HISTORY]

    AwardCategoryRef:
      type: [object, 'null']
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        nameUk:
          type: string
        level:
          $ref: '#/components/schemas/RecognitionLevel'

    AwardCreateRequest:
      type: object
      description: A draft needs a title in at least one language; every other field may be empty.
      properties:
        title:
          type: string
          maxLength: 500
        titleUk:
          type: string
          maxLength: 500
        description:
          type: string
          maxLength: 4000
        descriptionUk:
          type: string
          maxLength: 4000
        categoryId:
          type: integer
          format: int64
        awardingOrganization:
          type: string
          maxLength: 255
        awardDate:
          type: string
          format: date
        externalUrl:
          type: string
          format: uri
          maxLength: 2048

    AwardUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AwardCreateRequest'
        - type: object
          required: [version]
          properties:
            version:
              type: integer
              format: int64

    AwardSubmitRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          format: int64
          description: Version of the draft last read
        acknowledgeDuplicate:
          type: boolean
          default: false
          description: The owner confirmed that a possible duplicate is another award

    AwardPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/Award'

    UserRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email

    VersionAction:
      type: string
      enum: [BASELINE, CREATED, UPDATED, SUBMITTED]
      description: What produced the version; `BASELINE` is the state of an award when versioning started

    AwardSnapshot:
      type: object
      description: Business fields of an award at one version
      properties:
        title:
          type: string
          nullable: true
        titleUk:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        descriptionUk:
          type: string
          nullable: true
        awardingOrganization:
          type: string
          nullable: true
        awardDate:
          type: string
          format: date
          nullable: true
        categoryId:
          type: integer
          format: int64
          nullable: true
        status:
          $ref: '#/components/schemas/AwardStatus'
        impactScore:
          type: integer
          nullable: true
        verificationBadge:
          type: boolean
        externalUrl:
          type: string
          nullable: true
        organizationId:
          type: integer
          format: int64

    FieldChange:
      type: object
      properties:
        field:
          type: string
          description: Snapshot field name
          example: categoryId
        from:
          nullable: true
          description: Value in the previous version
        to:
          nullable: true
          description: Value in this version

    AwardVersion:
      type: object
      properties:
        number:
          type: integer
          format: int64
          description: The award's `version` after the change
        action:
          $ref: '#/components/schemas/VersionAction'
        actor:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          nullable: true
          description: Who saved it; empty for a baseline or an erased account
        createdAt:
          type: string
          format: date-time
        snapshot:
          $ref: '#/components/schemas/AwardSnapshot'
        changes:
          type: array
          description: Fields that differ from the previous visible version; empty for the first
          items:
            $ref: '#/components/schemas/FieldChange'

    AwardVersionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AwardVersion'

    AuditTrailEntry:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        actorId:
          type: integer
          format: int64
          nullable: true
          description: Who acted; empty for migrations, seeds, jobs and rows written before 2.2.1
        actorName:
          type: string
          nullable: true
        actorEmail:
          type: string
          nullable: true
        action:
          type: string
          description: '`INSERT`, `UPDATE`, `DELETE` (table triggers) or an application event'
          example: AWARD_SUBMITTED
        entityType:
          type: string
          example: awards
        entityId:
          type: integer
          format: int64
          nullable: true
        changedFields:
          type: array
          items:
            type: string
        oldValues:
          type: object
          additionalProperties: true
          description: Column values before the change; empty when none
        newValues:
          type: object
          additionalProperties: true
          description: Column values after the change, or the facts of an application event; empty when none
        ipAddress:
          type: string
          nullable: true
          description: Client address of application rows; empty on trigger rows
        correlationId:
          type: string
          format: uuid
          nullable: true

    AuditTrailPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/AuditTrailEntry'

    DocumentRef:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fileName:
          type: string
        type:
          $ref: '#/components/schemas/DocumentType'

    # Workflow
    ApprovalRequest:
      type: object
      properties:
        comment:
          type: string
          maxLength: 1000

    RejectionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000

    ReturnRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 1000
        requiredChanges:
          type: array
          items:
            type: string

    # Document
    Document:
      type: object
      required: [id, awardId, fileName, type, mimeType, size, uploadedAt, uploadedBy]
      properties:
        id:
          type: integer
          format: int64
        awardId:
          type: integer
          format: int64
        fileName:
          type: string
          maxLength: 255
          description: The uploaded name, cleaned; the extension matches the content
        type:
          $ref: '#/components/schemas/DocumentType'
        mimeType:
          type: string
          enum: [application/pdf, image/jpeg, image/png, image/webp]
          description: Found in the content, not taken from the request
        size:
          type: integer
          format: int64
          maximum: 10485760
        description:
          type: string
          maxLength: 500
          nullable: true
        uploadedAt:
          type: string
          format: date-time
        uploadedBy:
          $ref: '#/components/schemas/UserRef'

    DocumentType:
      type: string
      enum:
        - CERTIFICATE
        - DIPLOMA
        - SUPPORTING_DOCUMENT
        - PHOTO

    # Reports
    AwardsSummary:
      type: object
      properties:
        period:
          type: string
        totalAwards:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byCategory:
          type: object
          additionalProperties:
            type: integer
        approvalRate:
          type: number
          format: float
        averageProcessingDays:
          type: number
          format: float

    # Common
    Page:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        timestamp:
          type: string
          format: date-time
        errors:
          type: array
          description: One entry per refused field (`validation-failed`, `award-incomplete`)
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
                enum: [required, too-long, invalid, inactive, future, too-old]
              message:
                type: string
        matches:
          type: array
          description: The own awards the submitted one looks like (`award-possible-duplicate`)
          items:
            $ref: '#/components/schemas/DuplicateMatch'
        currentVersion:
          type: integer
          format: int64
          description: The version of the award now (`award-stale`)
        awardStatus:
          $ref: '#/components/schemas/AwardStatus'

  responses:
    BadRequest:
      description: >
        Invalid request parameters; a path or query value of the wrong type answers
        `urn:awards:problem:invalid-parameter` with the name in `parameter`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Forbidden:
      description: Insufficient permissions
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    Conflict:
      description: Resource conflict (e.g., concurrent modification)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    ValidationFailed:
      description: >
        Invalid fields (`urn:awards:problem:validation-failed`), one entry per field in `errors`; a value that
        cannot be read at all (a date that does not exist, text for a number) is reported with code `invalid`
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    AwardConflict:
      description: >
        `urn:awards:problem:award-stale` with `currentVersion` when the award changed since it was read, or
        `award-not-editable` with `awardStatus` when it is no longer a draft
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until rate limit resets

security:
  - bearerAuth: []

